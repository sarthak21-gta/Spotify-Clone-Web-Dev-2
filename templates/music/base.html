
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TuneWave{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'music/css/style.css' %}">
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <h2 class="logo">♪ TuneWave</h2>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'songs' %}">Songs</a>
            <a href="{% url 'playlists' %}">Playlists</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Sign Up</a>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</div>

<footer class="music-player">
    <div class="player-song">
        <span>♪</span>
        <div>
            <strong id="current-song">Select a song</strong>
            <p id="current-artist">TuneWave</p>
        </div>
    </div>

    <div class="player-controls">
        <button id="play-pause">▶</button>
        <input type="range" id="progress" value="0" min="0" max="100">
    </div>

    <audio id="audio-player"></audio>
</footer>

<script src="{% static 'music/js/player.js' %}"></script>
</body>
</html>
