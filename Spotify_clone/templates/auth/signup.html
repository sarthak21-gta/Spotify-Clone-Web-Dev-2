{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Spotify</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/spotify.css' %}">
</head>
<body style="background-color: var(--bg-black);">
    <div class="auth-wrapper">
        <div class="auth-box">
            <a href="{% url 'home' %}" class="auth-logo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.48.66.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                </svg>
                <span>Spotify</span>
            </a>

            <h1 class="auth-title">Sign up to start listening</h1>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{% url 'signup' %}" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Choose a username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Email address</label>
                    <input type="email" name="email" class="form-input" placeholder="name@domain.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Create a password</label>
                    <input type="password" name="password" class="form-input" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="btn-pill btn-green" style="width: 100%; justify-content: center; padding: 14px 20px; margin-top: 8px;">
                    Sign Up
                </button>
            </form>

            <div class="auth-divider"></div>

            <p class="auth-footer">
                Already have an account? <a href="{% url 'login' %}">Log in here</a>
            </p>
            <p class="auth-footer" style="margin-top: -12px;">
                <a href="{% url 'home' %}">Back to Home</a>
            </p>
        </div>
    </div>
</body>
</html>
